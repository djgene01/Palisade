# Builds the firewall's install package whenever a version tag such as v1.0 is pushed, and publishes it
# as a GitHub release. Firewalls with updates switched on install the newest release by themselves.
# The companion app (Android APK, Windows zip) is added to the same release afterwards, by its own jobs,
# so a problem building the app never holds back a firewall release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Each test project by name: the solution also holds the companion app, which needs the MAUI workload.
      # The client tests start the real web interface on free local ports and talk to it over TLS.
      - name: Test
        run: |
          set -eu
          dotnet test tests/Palisade.Core.Tests --nologo
          dotnet test tests/Palisade.Web.Tests --nologo
          dotnet test tests/Palisade.Client.Tests --nologo

      - name: Build the package
        run: |
          set -eu
          out=release/palisade
          dotnet publish src/Palisade.Agent -c Release -r linux-x64 --self-contained -o "$out/agent" --nologo
          dotnet publish src/Palisade.Web -c Release -r linux-x64 --self-contained -o "$out/web" --nologo
          cp deploy/install.sh deploy/palisade-agent.service deploy/palisade-web.service deploy/palisade-dns@.service deploy/palisade-capture.service deploy/palisade-lease-name "$out/"
          printf '%s\n' "$GITHUB_REF_NAME" > "$out/VERSION"
          tar -czf palisade-linux-x64.tar.gz -C release palisade

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" palisade-linux-x64.tar.gz --title "$GITHUB_REF_NAME" --generate-notes

  # The Android app, signed with the owner's key from the repository's secrets (see deploy/android-signing-key.ps1).
  # Every update must carry the same key, so without one this job explains what is missing and builds nothing.
  android:
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
    steps:
      - name: Check for the signing key
        if: env.HAS_KEY != 'true'
        run: echo "::warning title=No Android app in this release::Set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (deploy/android-signing-key.ps1 does it) to add the app."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-dotnet@v4
        if: env.HAS_KEY == 'true'
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: microsoft
          java-version: "21"

      - name: Build the signed APK
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          dotnet workload install maui-android
          keystore="$RUNNER_TEMP/palisade.keystore"
          # Secrets set by piping from a terminal can end in a line break; neither value can contain one.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$keystore"
          ANDROID_SIGNING_PASSWORD="$(printf '%s' "$ANDROID_SIGNING_PASSWORD" | tr -d '\r\n')"
          export ANDROID_SIGNING_PASSWORD
          # The version shown is the tag without its "v". The version code that Android compares before allowing
          # an update must only ever grow: it is this workflow's run number, so renaming or recreating this
          # workflow (which restarts the count at 1) would make phones refuse every later update.
          dotnet publish src/Palisade.App -f net10.0-android -c Release -o out --nologo \
            -p:AndroidPackageFormats=apk \
            -p:ApplicationDisplayVersion="${GITHUB_REF_NAME#v}" -p:ApplicationVersion="${{ github.run_number }}" \
            -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$keystore" -p:AndroidSigningKeyAlias=palisade \
            -p:AndroidSigningKeyPass=env:ANDROID_SIGNING_PASSWORD -p:AndroidSigningStorePass=env:ANDROID_SIGNING_PASSWORD
          rm -f "$keystore"
          cp out/io.github.djgene01.palisade-Signed.apk palisade-android.apk

      - name: Add it to the release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" palisade-android.apk

  # The Windows app as a portable folder: unzip and run Palisade.App.exe, nothing to install.
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # On Windows the app also targets Android, and restoring it needs that workload as well.
          dotnet workload install maui-windows maui-android
          dotnet publish src/Palisade.App -f net10.0-windows10.0.19041.0 -c Release -o out/Palisade --nologo `
            -p:SelfContained=true -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true `
            -p:ApplicationDisplayVersion="$($env:GITHUB_REF_NAME.TrimStart('v'))" -p:ApplicationVersion="${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { throw 'Building the Windows app failed.' }
          Compress-Archive -Path out/Palisade -DestinationPath palisade-windows-x64.zip

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" palisade-windows-x64.zip
