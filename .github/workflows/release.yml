# Builds the firewall's install package whenever a version tag such as v1.0 is pushed, and publishes it
# as a GitHub release. Firewalls with updates switched on install the newest release by themselves.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Only the firewall's own projects: the solution also holds the companion app, which needs the MAUI workload.
      - name: Test
        run: dotnet test tests/Palisade.Core.Tests --nologo

      - name: Build the package
        run: |
          set -eu
          out=release/palisade
          dotnet publish src/Palisade.Agent -c Release -r linux-x64 --self-contained -o "$out/agent" --nologo
          dotnet publish src/Palisade.Web -c Release -r linux-x64 --self-contained -o "$out/web" --nologo
          cp deploy/install.sh deploy/palisade-agent.service deploy/palisade-web.service deploy/palisade-dns@.service "$out/"
          printf '%s\n' "$GITHUB_REF_NAME" > "$out/VERSION"
          tar -czf palisade-linux-x64.tar.gz -C release palisade

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" palisade-linux-x64.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
