<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Palisade</title>
    <base href="/" />
    <script>
        // Set the theme before first paint so the page never flashes the wrong colours.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem("palisade-theme"); } catch (e) { }
            if (saved === "dark" || (saved === null && matchMedia("(prefers-color-scheme: dark)").matches))
                document.documentElement.classList.add("dark");
        })();
    </script>
    <link rel="stylesheet" href="_content/Palisade.UI/app.css" />
    <link rel="icon" href="data:,">
</head>

<body>
    <div id="app"></div>

    <script src="_content/Palisade.UI/js/palisade.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
